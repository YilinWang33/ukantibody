defaults:
  - inference_base
  - generation: motif
  - _self_

ckpt_path: ./store/antibody_cdr_finetune_motif/checkpoints
ckpt_name: last-EMA.ckpt
autoencoder_ckpt_path: ./checkpoints_laproteina/AE3_motif.ckpt

generation:
  dataset:
    motif_task_name: 4ffv_cdrh3  # 👈 想跑哪个抗体就在这里换名字
    nsamples: 10

    # ==========================================
    # 完整的抗体约束配置（包含了总长度与多链顺序）
    # ==========================================
    motif_dict_cfg:
      4ffv_cdrh3:
        # 使用你刚刚脚本生成的精确 contig，完美避开所有缺失(gap)区域
        contig_string: "A39-395/L1-29/L37-57/L65-72/L74-80/L83-108/H1-9/H11-30/H35-59/H62-72/H74-96/10-10/H107-109/H113-119"
        motif_pdb_path: "/DATA/disk3/yilin/dyMEAN/all_data/pdb/4ffv.pdb"
        atom_selection_mode: "all_atom"
        motif_only: False
        # 使用你刚刚脚本算出的精确长度
        motif_min_length: 556
        motif_max_length: 556
        segment_order: "A;L;H"

      3nid_cdrh3:
        contig_string: "A1-371/D1-373/L1-109/H1-96/12-12/H109-120"
        motif_pdb_path: "/DATA/disk3/yilin/dyMEAN/all_data/pdb/3nid.pdb"
        atom_selection_mode: "all_atom"
        motif_only: False
        motif_min_length: 973
